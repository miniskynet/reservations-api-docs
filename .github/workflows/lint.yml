name: Lint OpenAPI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint the spec
        run: npx --yes @redocly/cli@latest lint --format=github-actions
